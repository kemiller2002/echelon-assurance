name: assurance-validation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate registers
        run: python3 -I tools/validate_registers.py
      - name: Fragments merge cleanly
        run: python3 -I tools/merge_fragments.py --check
